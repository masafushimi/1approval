<title>1Approval 連携アプリストア</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400..900&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: 1approval.com に合わせたストア。白ヘッダー → 中央寄せヒーロー（グラデ強調語＋HUB図） → カテゴリタブ → 左フィルタ＋右カード。詳細は右ドロワー。
   ルール：amber #FFB800 + ink #0F172A、文字6段階(12/14/16/18/24/36)、太さ700/900、角丸12px、影なし・浮き上がりなし、英字の小見出しなし */
:root{
  --bg:#FFFFFF; --tint:#FFFDF5; --soft:#F8FAFC; --ink:#0F172A; --ink2:#475569; --ink3:#64748B; --line:#E2E8F0; --line2:#CBD5E1;
  --amber:#FFB800; --amber-ink:#92600A; --amber-soft:#FFF7E0;
  --grad:linear-gradient(135deg,#FF3366 0%,#FF6633 30%,#FFCC00 60%,#00C853 80%,#00B0FF 100%);
  --s-live:#047857; --s-live-bg:#ECFDF5; --s-dev:#1D4ED8; --s-dev-bg:#EFF6FF; --s-plan:#6D28D9; --s-plan-bg:#F5F3FF;
  --s-talk:#C2410C; --s-talk-bg:#FFF7ED; --s-idea:#475569; --s-idea-bg:#F1F5F9;
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
.brand img{height:36px;width:auto}
.brand span{font-size:14px;font-weight:700;color:var(--ink2);border-left:1px solid var(--line);padding-left:12px}
.search{flex:1 1 300px;display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:8px 16px}
.search:focus-within{border-color:var(--amber);background:#fff}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:14px;outline:none}
.search input::placeholder{color:#94A3B8}
.topnav{display:flex;gap:12px;align-items:center;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:8px 20px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--line2);background:#fff;color:var(--ink)}
.btn:hover{border-color:var(--ink3)}
.btn.grad{border:0;background:var(--grad);color:#fff}
.btn.grad:hover{opacity:.9}

/* hero */
.hero{background:var(--tint);border-bottom:1px solid var(--line)}
.hero .wrap{padding-block:48px 40px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.badge{display:inline-block;font-size:12px;font-weight:700;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 16px}
h1{font-weight:900;font-size:36px;line-height:1.35;margin:0;text-wrap:balance}
h1 .big{display:block;font-size:clamp(36px,6vw,60px);line-height:1.25}
.hero p{color:var(--ink2);max-width:40em;margin:0;font-size:16px}
.stats{display:flex;gap:40px;flex-wrap:wrap;justify-content:center}
.stats div{display:flex;flex-direction:column;align-items:center}
.stats b{font-family:var(--f-mono);font-size:36px;font-weight:500;line-height:1.2}
.stats span{font-size:12px;color:var(--ink3);font-weight:700}

.flow{width:100%;max-width:1000px;margin-top:8px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,.8fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;text-align:left}
.flow .col{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.flow .lbl{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.flow .chip{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff}
.flow .hubc{border:2px solid var(--amber);border-radius:12px;background:#fff;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;min-width:0}
.flow .hubc img{height:28px;width:auto}
.flow .hubc small{font-size:12px;color:var(--ink2);text-align:center;line-height:1.5}
.flow .hubc .tagh{position:absolute;top:-11px;background:var(--amber);color:var(--ink);font-size:12px;font-weight:900;border-radius:999px;padding:0 10px}
.flow .arr{color:#06B6D4;font-weight:900;font-size:18px}

/* category rail */
.rail{border-bottom:1px solid var(--line);background:#fff}
.rail .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.rail button{background:none;border:0;padding:14px 12px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;color:var(--ink2);font-weight:700;font-size:14px}
.rail button:hover{color:var(--ink)}
.rail button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.rail button em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--ink3);margin-left:4px}

/* main */
main .wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;padding-block:32px 72px}
aside{display:flex;flex-direction:column;gap:24px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;max-height:calc(100vh - 100px);overflow:auto}
aside h3{font-size:14px;color:var(--ink);margin:0 0 6px;font-weight:700}
.opt{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;font-size:14px;color:var(--ink2)}
.opt input{accent-color:#FFB800;margin:0}
.opt .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--ink3)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.legend{font-size:12px;color:var(--ink3);line-height:1.75;border-top:1px solid var(--line);padding-top:16px}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar h2{font-weight:900;font-size:24px;margin:0}
.bar .count{color:var(--ink3);font-size:14px;font-family:var(--f-mono)}
.seg{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff;padding:3px}
.seg button{border:0;background:none;padding:4px 14px;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink2);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* featured */
.featured{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:40px}
.feat{position:relative;border-radius:12px;padding:20px 20px 20px 24px;background:#fff;border:1px solid var(--line);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
.feat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#FFB800)}
.feat:hover{border-color:var(--line2)}
.feat .tag{font-size:12px;font-weight:700;color:var(--ink3)}
.feat h4{margin:0;font-size:18px;font-weight:900;line-height:1.4}
.feat p{margin:0;color:var(--ink2);font-size:14px;line-height:1.75}

.group-title{font-weight:900;font-size:18px;margin:36px 0 4px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.group-title:first-child{margin-top:0}
.group-title small{font-weight:400;font-size:14px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px;margin-top:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;min-width:0;transition:border-color .15s}
.card:hover{border-color:var(--amber)}
.card .head{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none;letter-spacing:0}
.logo.img{background:#fff;border:1px solid var(--line);padding:6px}
.logo.img.wide{width:88px;padding:4px}
.d-head .logo.img.wide{width:120px}
.logo.img img{width:100%;height:100%;object-fit:contain;display:block}
.card .nm{min-width:0}
.card .nm b{display:block;font-size:14px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}
.card .nm span{display:block;font-size:12px;color:var(--ink3)}
.card p{margin:0;font-size:14px;color:var(--ink2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.4em}
.card .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:1px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.meth{font-size:12px;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:0 8px;white-space:nowrap}
.st-live{color:var(--s-live);background:var(--s-live-bg)} .st-dev{color:var(--s-dev);background:var(--s-dev-bg)}
.st-plan{color:var(--s-plan);background:var(--s-plan-bg)} .st-talk{color:var(--s-talk);background:var(--s-talk-bg)} .st-idea{color:var(--s-idea);background:var(--s-idea-bg)}
.pill.pri{color:#92600A;background:#FFF7E0}
.empty{padding:48px 16px;color:var(--ink3);border:1px dashed var(--line2);border-radius:12px;font-size:14px}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:880px;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink3);background:var(--soft);font-weight:700}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--amber-soft)}
td.src{color:var(--ink3);font-size:12px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:41;overflow:auto;border-left:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) 24px;display:flex;flex-direction:column;gap:20px}
.drawer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(14px,env(safe-area-inset-right,0px));border:1px solid var(--line);background:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.d-head{display:flex;gap:16px;align-items:center;padding-right:40px}
.d-head .logo{width:60px;height:60px;font-size:18px}
.d-head h2{margin:0;font-size:24px;font-weight:900;line-height:1.35}
.d-head span{color:var(--ink3);font-size:14px}
.cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 16px;font-size:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px;margin:0}
.kv dt{color:var(--ink3);font-weight:700} .kv dd{margin:0}
.drawer h3{font-size:14px;font-weight:700;margin:0 0 6px}
.drawer ul{margin:0;padding-left:1.2em;color:var(--ink2);font-size:14px}
.drawer ul li{margin:2px 0}
.drawer .lead{margin:0;color:var(--ink2);font-size:16px}
.note{font-size:12px;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;z-index:60;font-size:14px;font-weight:700}

footer{border-top:1px solid var(--line);color:var(--ink3);font-size:12px;background:var(--soft)}
footer .wrap{padding-block:24px 36px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
footer img{height:24px;width:auto}

@media (max-width:1000px){
  .flow{grid-template-columns:1fr;max-width:420px}
  .flow .arr{transform:rotate(90deg);justify-self:center}
  .featured{grid-template-columns:1fr}
  main .wrap{grid-template-columns:1fr}
  aside{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;gap:16px}
  aside section{flex:1 1 180px}
  .legend{flex-basis:100%}
  .topnav .btn:not(.grad){display:none}
}
@media (max-width:560px){
  .topnav{display:none}
  .brand span{display:none}
  .seg{margin-left:0}
  h1{font-size:24px}
  .stats{gap:24px}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

/* hero v2 */
.nw{display:inline-block;white-space:nowrap}
.hero{position:relative;overflow:hidden;background:var(--tint)}
.hero::before{content:"";position:absolute;inset:-40% -10% auto;height:520px;background:radial-gradient(closest-side,rgba(255,184,0,.18),transparent 70%),radial-gradient(closest-side at 80% 60%,rgba(0,176,255,.10),transparent 70%);pointer-events:none}
.hero .wrap.hero-in{position:relative;padding-block:56px 28px;gap:22px}
.hero h1{font-size:36px;line-height:1.3}
.hero h1 .big{font-size:clamp(36px,6.4vw,64px);line-height:1.2;margin-top:6px}
.hero h1 .big .mono{font-family:var(--f-mono);font-weight:500;letter-spacing:-.02em}
.hsearch{width:100%;max-width:720px;display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:8px 8px 8px 22px}
.hsearch:focus-within{border-color:var(--amber)}
.hsearch input{flex:1;min-width:0;border:0;outline:none;background:none;font:inherit;font-size:16px;color:var(--ink);padding-block:8px}
.hsearch input::placeholder{color:#94A3B8}
.hs-btn{flex:none;border:0;cursor:pointer;background:var(--grad);color:#fff;font-weight:900;font-size:14px;border-radius:999px;padding:10px 22px}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.quick span{font-size:12px;color:var(--ink3);font-weight:700;margin-right:4px}
.quick button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:3px 14px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink2)}
.quick button:hover{border-color:var(--ink);color:var(--ink)}
.hero .stats{margin-top:4px}
.wall{position:relative;display:flex;flex-direction:column;gap:14px;padding-block:8px 44px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.row{display:flex;gap:14px;width:max-content;animation:slide var(--dur,60s) linear infinite}
.row.rev{animation-direction:reverse}
.wall:hover .row{animation-play-state:paused}
.tile{width:76px;height:76px;flex:none;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;padding:12px}
.tile.w{width:140px}
.tile img{width:100%;height:100%;object-fit:contain}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.row{animation:none}}
@media (max-width:560px){.top .search{display:none}.tile{width:56px;height:56px;padding:9px}.tile.w{width:104px}.hs-btn{display:none}.hero h1{font-size:24px}}
</style>

function mono(name){
  const s=name.replace(/^(Microsoft|Google|SAP|RICOH|1Approval)\s+/,"").replace(/[（(].*$/,"").trim();
  const ascii=s.match(/[A-Za-z0-9]+/g);
  if(/^\d+$/.test(s)) return s.slice(0,3);
  if(/^[A-Za-z0-9]/.test(s) && ascii){ return (ascii.length>1? ascii[0][0]+ascii[1][0] : ascii[0].slice(0,2)).replace(/^./,c=>c.toUpperCase()); }
  return s.slice(0,2);
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function match(a, ignore){
  if(ignore!=="cat" && state.cat!=="all" && a.cat!==state.cat) return false;
  if(ignore!=="status" && state.status.size && !state.status.has(a.status)) return false;
  if(ignore!=="method" && state.method.size && !a.method.some(m=>state.method.has(m))) return false;
  if(ignore!=="kind" && state.kind.size && !state.kind.has(a.kind)) return false;
  if(state.q){
    const hay=(a.name+a.vendor+a.desc+a.can.join("")+a.method.join("")+catOf(a.cat).name).toLowerCase();
    if(!state.q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>hay.includes(t))) return false;
  }
  return true;
}

function renderRail(){

}
function optList(el,key,items){
  el.innerHTML=items.map(it=>{
    const n=APPS.filter(a=>match(a,key)&&(key==="status"?a.status===it.v:key==="method"?a.method.includes(it.v):a.kind===it.v)).length;
    return `<label class="opt"><input type="checkbox" id="f-${key}-${it.v}" data-k="${key}" value="${esc(it.v)}" ${state[key].has(it.v)?"checked":""}>${it.dot?`<span class="dot" style="background:${it.dot}"></span>`:""}${esc(it.n)}<span class="n">${n}</span></label>`;
  }).join("");
}
function renderFilters(){
  optList(document.getElementById("fStatus"),"status",ORDER.map(s=>({v:s,n:STATUS[s].n,dot:STATUS[s].col})));
  const ms=[...new Set(APPS.flatMap(a=>a.method))];
  const mc=m=>APPS.filter(a=>a.method.includes(m)).length;
  ms.sort((x,y)=>mc(y)-mc(x));
  optList(document.getElementById("fMethod"),"method",ms.filter(m=>mc(m)>=2||state.method.has(m)).map(m=>({v:m,n:m})));
  optList(document.getElementById("fKind"),"kind",[{v:"公式",n:"1Approval 公式"},{v:"パートナー",n:"パートナー"}]);
}

function renderResults(){
  const list=APPS.filter(a=>match(a));
  const rank=a=>a.status==="live"?0:a.pri?1:2+ORDER.indexOf(a.status);
  list.sort((x,y)=>rank(x)-rank(y));
  document.getElementById("count").textContent=`${list.length}件`;
  document.getElementById("viewTitle").textContent= state.cat==="all"?"すべての連携":catOf(state.cat).name;
  const out=document.getElementById("results");
  if(!list.length){ out.innerHTML=`<div class="empty">条件に合う連携が見つかりません。検索語を変えるか、フィルタを外してください。<br>見つからないサービスは「要望を送る」から追加をリクエストできます。</div>`; return; }
  if(state.view==="table"){
    const byCat=[...list].sort((x,y)=>CATS.findIndex(c=>c.id===x.cat)-CATS.findIndex(c=>c.id===y.cat)||rank(x)-rank(y));
    out.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>カテゴリ</th><th>サービス</th><th>提供元</th><th>状態</th><th>連携方式</th><th>料金の考え方</th><th>出典</th></tr></thead><tbody>${
      byCat.map(a=>`<tr data-id="${a.id}" tabindex="0"><td>${esc(catOf(a.cat).name)}</td><td><b>${esc(a.name)}</b></td><td>${esc(a.vendor)}</td><td>${pill(a.status)}</td><td>${esc(a.method.join(" / "))}</td><td>${esc(a.price)}</td><td class="src">${esc(a.src)}</td></tr>`).join("")
    }</tbody></table></div>`;
    return;
  }
  const cats= state.cat==="all"? CATS : [catOf(state.cat)];
  out.innerHTML=cats.map(c=>{
    const items=list.filter(a=>a.cat===c.id); if(!items.length) return "";
    return `<h3 class="group-title">${c.name}<small>${c.hint}・${items.length}件</small></h3><div class="grid">${items.map(card).join("")}</div>`;
  }).join("");
}

  const seen=new Set(), list=[];
  APPS.forEach(a=>{const s=LOGOS[a.id]; if(s&&!seen.has(s)){seen.add(s);list.push({s,w:WIDE.has(a.id)});}});
  const rows=[[],[],[]]; list.forEach((x,i)=>rows[i%3].push(x));
  document.getElementById("wall").innerHTML=rows.map((r,i)=>{const tiles=r.map(x=>`<span class="tile${x.w?" w":""}"><img src="${x.s}" alt="" loading="eager"></span>`).join("");
    return `<div class="row${i%2?" rev":""}" style="--dur:${54+i*10}s">${tiles}${tiles}</div>`;}).join("");
  document.getElementById("heroN").textContent=APPS.length;
  const q=document.getElementById("q"), q2=document.getElementById("q2");
  const go=v=>{q.value=q2.value=v; state.q=v.trim(); renderAll(); document.querySelector(".rail").scrollIntoView({behavior:"smooth"});};
  q2.addEventListener("input",e=>{q.value=e.target.value; state.q=e.target.value.trim(); renderAll();});
  q2.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go(q2.value);}});
  document.querySelectorAll(".quick [data-q]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.q)));
  q.addEventListener("input",e=>{q2.value=e.target.value;});
  document.getElementById("hsGo").addEventListener("click",()=>go(q2.value));
})();
renderAll();
</script>
